name: Release

# Push a tag like v0.8.0 to build installers for every OS and attach them to a draft release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # One draft up front, so the three build jobs attach to it instead of racing to create their own.
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create draft release
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "DevPlus ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build and publish
        shell: bash
        # Without a Developer ID, macOS builds are ad-hoc signed: Apple Silicon won't run a fully unsigned app.
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "$CSC_LINK" ]; then
            npm run release -- -c.mac.identity=-
          else
            npm run release
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional signing. Builds are unsigned when these secrets are absent.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' }}
