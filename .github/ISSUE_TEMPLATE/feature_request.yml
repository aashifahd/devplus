name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or workflow, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: input
    id: engine
    attributes:
      label: Which database engines does this concern?
